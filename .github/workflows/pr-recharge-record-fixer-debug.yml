name: Apply recharge record isolation fix

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: python scripts/fix_recharge_record_isolation.py

      - name: Validate and commit
        shell: bash
        run: |
          python -m py_compile server/kugo_mergedl.py
          grep -q "tel_data_id: telDataID" usrvip/index.html
          grep -q "AND yzm_status='3'" server/kugo_mergedl.py
          grep -q "and init='1'" server/kugo_mergedl.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add usrvip/index.html server/kugo_mergedl.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix recharge status tracking by formal tel_data record"
          git push origin HEAD:main
