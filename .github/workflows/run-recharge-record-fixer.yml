name: Run recharge record fixer

on:
  push:
    paths:
      - '.github/recharge-fix-trigger'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Execute embedded patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/fix-recharge-record-isolation.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          block = workflow[start:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(code, 'embedded_recharge_fixer.py', 'exec'), {})
          PY

      - name: Validate patched files
        shell: bash
        run: |
          python -m py_compile server/kugo_mergedl.py
          grep -q "tel_data_id: telDataID" usrvip/index.html
          grep -q "AND yzm_status='3'" server/kugo_mergedl.py
          grep -q "AND init='1'" server/kugo_mergedl.py

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add usrvip/index.html server/kugo_mergedl.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix recharge status tracking by formal tel_data record"
          git push origin HEAD:main
