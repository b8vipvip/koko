name: Optimize 充值2026 source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/optimize-chongzhi2026.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply conservative source fixes
        run: python anjianjingling/optimize_chongzhi2026_once.py

      - name: Commit optimized source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/optimize-chongzhi2026.yml
          rm -f anjianjingling/optimize_chongzhi2026_once.py
          git add anjianjingling/ .github/workflows/
          git diff --cached --stat
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'Optimize 充值2026 main script and fix bugs'
          git push
