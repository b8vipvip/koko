name: Optimize 充值2026 source

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'anjianjingling/.optimize-trigger'

permissions:
  contents: write

jobs:
  optimize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply conservative source fixes
        run: python anjianjingling/optimize_chongzhi2026_once.py

      - name: Commit optimized source to PR branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/optimize-chongzhi2026.yml
          rm -f anjianjingling/optimize_chongzhi2026_once.py
          rm -f anjianjingling/.optimize-trigger
          git add anjianjingling/ .github/workflows/
          git diff --cached --stat
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'Optimize 充值2026 main script and fix bugs [skip ci]'
          git push origin HEAD:${{ github.head_ref }}
