name: Optimize 充值2026 source

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'anjianjingling/.optimize-trigger'

permissions:
  contents: write

jobs:
  optimize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Make optimizer preserve MQ source encoding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('anjianjingling/optimize_chongzhi2026_once.py')
          s = p.read_text(encoding='utf-8')
          old = """raw = SOURCE.read_bytes()\nbom = b'\\xef\\xbb\\xbf' if raw.startswith(b'\\xef\\xbb\\xbf') else b''\nbody = raw[len(bom):].decode('utf-8')"""
          new = """raw = SOURCE.read_bytes()\nbom = b'\\xef\\xbb\\xbf' if raw.startswith(b'\\xef\\xbb\\xbf') else b''\nif bom:\n    source_encoding = 'utf-8'\n    body = raw[len(bom):].decode('utf-8')\nelse:\n    try:\n        body = raw.decode('utf-8')\n        source_encoding = 'utf-8'\n    except UnicodeDecodeError:\n        body = raw.decode('gb18030')\n        source_encoding = 'gb18030'"""
          if old not in s:
              raise SystemExit('encoding read block not found')
          s = s.replace(old, new, 1)
          old_write = "SOURCE.write_bytes(bom + out.encode('utf-8'))"
          new_write = "SOURCE.write_bytes(bom + out.encode(source_encoding))"
          if old_write not in s:
              raise SystemExit('encoding write block not found')
          s = s.replace(old_write, new_write, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply conservative source fixes
        id: optimize
        shell: bash
        run: |
          set +e
          python anjianjingling/optimize_chongzhi2026_once.py > anjianjingling/optimizer-run.log 2>&1
          code=$?
          cat anjianjingling/optimizer-run.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload failure log
        if: steps.optimize.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-failure-log
          path: anjianjingling/optimizer-run.log
          if-no-files-found: error

      - name: Fail after log upload
        if: steps.optimize.outputs.exit_code != '0'
        run: exit 1

      - name: Commit optimized source to PR branch
        if: steps.optimize.outputs.exit_code == '0'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/optimize-chongzhi2026.yml
          rm -f anjianjingling/optimize_chongzhi2026_once.py
          rm -f anjianjingling/.optimize-trigger
          rm -f anjianjingling/optimizer-run.log
          git add anjianjingling/ .github/workflows/
          git diff --cached --stat
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'Optimize 充值2026 main script and fix bugs [skip ci]'
          git push origin HEAD:${{ github.head_ref }}
