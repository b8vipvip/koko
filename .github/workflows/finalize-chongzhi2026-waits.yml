name: Finalize 充值2026 wait framework

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'anjianjingling/.wait-refactor-trigger'
      - '.github/workflows/finalize-chongzhi2026-waits.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fix and validate refactored source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('anjianjingling/充值2026(db666069-c1bb-4a3a-b006-f19a0373a7f0).mq')
          raw = source.read_bytes()
          encoding = None
          for candidate in ('utf-8', 'gb18030'):
              try:
                  text = raw.decode(candidate)
                  encoding = candidate
                  break
              except UnicodeDecodeError:
                  pass
          if encoding is None:
              raise RuntimeError('无法识别 MQ 源码编码')

          newline = '\r\n' if text.count('\r\n') > text.count('\n') / 2 else '\n'
          text = text.replace('\r\n', '\n')
          text, fixed = re.subn(r'(?m)^\\\s*\n(?=\'={8,})', '', text)
          print('removed standalone backslash:', fixed)

          required = [
              'Function 静默找图',
              'Function 等待任一图片',
              'Function 等待并点击图片',
              'Function 必须等待界面',
              'Function 必须点击图片',
              'Function 等待状态回传',
              'Function 等待致命失败',
              'Function 选择最近任务酷狗',
          ]
          for marker in required:
              if marker not in text:
                  raise RuntimeError('缺少等待框架函数：' + marker)

          rewritten = [
              '初始化流程', 'appdl', '同步书签', '取消续费', '分享',
              '夸克登陆', '领取权益', '到价格界面', '到豪华价格界面'
          ]
          for name in rewritten:
              match = re.search(r'(?ms)^Function\s+' + re.escape(name) + r'(?:\([^\n]*\))?\n.*?^End Function\n', text)
              if not match:
                  raise RuntimeError('找不到重构函数：' + name)
              block = match.group(0)
              do_count = len(re.findall(r'(?mi)^\s*Do(?:\s|$)', block))
              if do_count:
                  raise RuntimeError(f'{name} 仍含 {do_count} 个 Do 循环')

          fn = len(re.findall(r'(?m)^Function\b', text))
          end_fn = len(re.findall(r'(?m)^End Function\b', text))
          sub = len(re.findall(r'(?m)^Sub\b', text))
          end_sub = len(re.findall(r'(?m)^End Sub\b', text))
          if fn != end_fn or sub != end_sub:
              raise RuntimeError(f'结构不平衡 Function={fn}/{end_fn}, Sub={sub}/{end_sub}')
          if re.search(r'(?m)^\\\s*$', text):
              raise RuntimeError('仍存在孤立反斜杠')
          for bad in ('选择最近任务酷狗超级', 'End IfTracePrint', 'End FunctionFunction'):
              if bad in text:
                  raise RuntimeError('发现代码拼接异常：' + bad)

          do_total = len(re.findall(r'(?mi)^\s*Do(?:\s|$)', text))
          loop_total = len(re.findall(r'(?mi)^\s*Loop(?:\s|$)', text))
          print(f'OK encoding={encoding} lines={len(text.splitlines())} Function={fn}/{end_fn} Sub={sub}/{end_sub} Do={do_total} Loop={loop_total}')

          out = text if newline == '\n' else text.replace('\n', '\r\n')
          source.write_bytes(out.encode(encoding))
          PY

      - name: Commit final source cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'anjianjingling/充值2026(db666069-c1bb-4a3a-b006-f19a0373a7f0).mq'
          if git diff --cached --quiet; then
            echo 'No cleanup changes required.'
            exit 0
          fi
          git commit -m 'Finalize unified wait framework [skip ci]'
          git push origin HEAD:${{ github.head_ref }}
