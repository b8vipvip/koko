            cursor.execute("UPDATE tel_data SET r_status=%s WHERE id=%s", ('等待', record_id))
            if cursor.rowcount:
                return

        if orderID:
            cursor.execute("UPDATE tel_data SET r_status=%s WHERE orderID=%s", ('等待', orderID))
            if cursor.rowcount:
                return

