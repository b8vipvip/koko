              order_id: orderID || (res && res.order_id) || '',
              phone: phone || (res && res.phone) || '',
              statusChecking: true,
              finalStatus: '',
              finalResult: '',
              finishedAt: null
            });
          }
          layer.alert(
'''
          text = replace_once(text, old, new, 'frontend: save formal tel_data id after api success')

