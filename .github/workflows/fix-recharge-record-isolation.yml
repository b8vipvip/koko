name: Fix recharge record isolation

on:
  push:
    paths:
      - '.github/workflows/fix-recharge-record-isolation.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply recharge record isolation fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          # -------------------------
          # usrvip/index.html
          # -------------------------
          p = Path('usrvip/index.html')
          text = p.read_text(encoding='utf-8')

          old = '''      layer.closeAll();
          const idx = showSpinner("正在充值，请稍候...");
          if (typeof window.kokoSaveRechargeProgressState === 'function') {
            window.kokoSaveRechargeProgressState({
              startAt: Date.now(),
              record_id: window.currentRecordID || data.record_id || '',
              order_id: orderID || '',
              phone: phone || '',
              statusChecking: true
            });
          }

          $.ajax({
'''
          new = '''      layer.closeAll();
