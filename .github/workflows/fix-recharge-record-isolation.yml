            window.kokoSaveRechargeProgressState({
              record_id: window.currentRecordID || data.record_id || (res && res.record_id) || '',
              order_id: orderID || (res && res.order_id) || '',
              phone: phone || (res && res.phone) || '',
              statusChecking: true
            });
          }
          layer.alert(
'''
          new = '''        success: res => {
          hideSpinner();

          // 后端返回的是正式充值记录 tel_data.id。后续95%状态轮询优先按这个ID精确查询，
