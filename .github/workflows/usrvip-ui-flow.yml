name: USRVIP front-end UI flow

on:
  pull_request:
    paths:
      - 'usrvip/index.html'
      - 'tests/test_usrvip_inline_flow.py'
      - 'tests/usrvip_progress_client.test.cjs'
      - 'tests/usrvip_history_result_client.test.cjs'
      - '.github/workflows/usrvip-ui-flow.yml'
  push:
    branches: [main]
    paths:
      - 'usrvip/index.html'
      - 'tests/test_usrvip_inline_flow.py'

permissions:
  contents: read

jobs:
  frontend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check inline JavaScript syntax and UI sequencing
        run: |
          python3 -m unittest discover -s tests -p 'test_usrvip_inline_flow.py' -v
          node tests/usrvip_progress_client.test.cjs
          node tests/usrvip_history_result_client.test.cjs
