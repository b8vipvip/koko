name: Diagnose Enterprise WeChat notification migration

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply notification migration
        run: python scripts/migrate_notifications_to_wecom.py

      - name: Capture syntax diagnostics
        shell: bash
        run: |
          set +e
          : > .github/wecom-migration-diagnostic.txt
          for f in admin/lib/config.php admin/lib/mailer.php admin/phpapi/system_settings.php admin/api.php admin/dev.php admin/email.php admin/mail_test.php admin/cron_balance_monitor.php; do
            echo "===== php -l $f =====" >> .github/wecom-migration-diagnostic.txt
            php -l "$f" >> .github/wecom-migration-diagnostic.txt 2>&1
            echo "exit=$?" >> .github/wecom-migration-diagnostic.txt
          done
          echo "===== python compile =====" >> .github/wecom-migration-diagnostic.txt
          python -m py_compile server/koko_task_helpers.py server/kugo_mergedl.py server/app_optimized-cdp.py >> .github/wecom-migration-diagnostic.txt 2>&1
          echo "exit=$?" >> .github/wecom-migration-diagnostic.txt

      - name: Commit diagnostics only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/wecom-migration-diagnostic.txt
          git commit -m "chore: capture WeCom migration diagnostics" || exit 0
          git push origin HEAD:main
