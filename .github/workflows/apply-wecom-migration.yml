name: Apply Enterprise WeChat notification migration

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply notification migration
        run: python scripts/migrate_notifications_to_wecom.py

      - name: Validate syntax and notification paths
        shell: bash
        run: |
          php -l admin/lib/config.php
          php -l admin/lib/mailer.php
          php -l admin/phpapi/system_settings.php
          php -l admin/api.php
          php -l admin/dev.php
          php -l admin/email.php
          php -l admin/mail_test.php
          php -l admin/cron_balance_monitor.php
          python -m py_compile server/koko_task_helpers.py server/kugo_mergedl.py server/app_optimized-cdp.py
          grep -q "wecom_corp_id" admin/index.html
          grep -q "wecom_agent_secret_configured" admin/phpapi/system_settings.php
          grep -q "send_new_task_wecom" server/koko_task_helpers.py
          grep -q "企业微信" admin/lib/mailer.php
          ! grep -nE "import smtplib|SMTP_HOST|SMTP_PASSWORD|MIMEText" server/koko_task_helpers.py
          ! grep -nE "PHPMailer|SMTP_HOST|SMTP_PASSWORD" admin/lib/mailer.php

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin server
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Replace email notifications with Enterprise WeChat"
          git push origin HEAD:main
