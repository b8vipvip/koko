name: Finalize Enterprise WeChat notification migration

on:
  push:
    paths:
      - '.github/wecom-finalize-trigger'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply final cleanup
        run: python scripts/finalize_wecom_migration.py

      - name: Audit notification senders
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('admin'), Path('server')]
          excluded_parts = {'vendor', '__pycache__'}
          patterns = {
              'smtplib': re.compile(r'\bsmtplib\b'),
              'SMTP env/config': re.compile(r'\bSMTP_(?:HOST|PORT|USERNAME|PASSWORD|ENCRYPTION)\b'),
              'PHPMailer': re.compile(r'\bPHPMailer\b'),
              'MIMEText': re.compile(r'\bMIMEText\b'),
              'sendmail call': re.compile(r'\.sendmail\s*\('),
              'SMTP mode call': re.compile(r'(?:->|\.)isSMTP\s*\('),
          }

          findings = []
          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file() or any(part in excluded_parts for part in path.parts):
                      continue
                  if path.suffix.lower() not in {'.php', '.py', '.html', '.js'}:
                      continue
                  try:
                      text = path.read_text(encoding='utf-8', errors='ignore')
                  except Exception:
                      continue
                  for lineno, line in enumerate(text.splitlines(), 1):
                      for name, pattern in patterns.items():
                          if pattern.search(line):
                              findings.append(f'{path}:{lineno}: [{name}] {line.strip()}')

          report = [
              '# Enterprise WeChat notification migration audit',
              '',
              'Scanned: admin/ and server/ (admin/vendor excluded)',
              '',
          ]
          if findings:
              report.append('Legacy direct email sender findings:')
              report.extend(findings)
          else:
              report.append('No direct SMTP/PHPMailer/smtplib email sender usage found.')

          Path('.github/wecom-notification-audit.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')
          if findings:
              raise SystemExit('\n'.join(findings))
          PY

      - name: Validate syntax
        shell: bash
        run: |
          php -l admin/lib/config.php
          php -l admin/lib/mailer.php
          php -l admin/phpapi/system_settings.php
          php -l admin/api.php
          php -l admin/dev.php
          php -l admin/email.php
          php -l admin/mail_test.php
          php -l admin/cron_balance_monitor.php
          python -m py_compile server/koko_task_helpers.py server/kugo_mergedl.py server/app_optimized-cdp.py

      - name: Commit final migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin server .github/wecom-notification-audit.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Finalize Enterprise WeChat notification migration"
          git push origin HEAD:main
